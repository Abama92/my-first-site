<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой первый сайт</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            padding: 40px;
        }
        h1 {
            color: #ff5722;
        }
        
        /* 👇 СЮДА МЫ ДОБАВИЛИ СТИЛИ ДЛЯ КНОПКИ */
        .my-btn {
            background-color: #ff5722; /* Оранжевый фон */
            color: white;              /* Белый текст */
            border: none;              /* Убираем рамку */
            padding: 12px 24px;        /* Размер кнопки */
            font-size: 16px;           /* Размер шрифта */
            border-radius: 8px;        /* Скругляем углы */
            cursor: pointer;           /* Курсор-палец при наведении */
            transition: 0.3s;          /* Плавное изменение цвета */
        }

        /* 👇 ЭФФЕКТ НАВЕДЕНИЯ МЫШКИ */
        .my-btn:hover {
            background-color: #e64a19; /* Кнопка станет чуть темнее */
        }
    </style>
</head>
<body>

    <h1>Привет! Я учусь кодить с нуля</h1>
    <p>Это моя первая настоящая веб-страница.</p>
    
    <!-- 👇 А СЮДА МЫ ВСТАВИЛИ САМУ КНОПКУ -->
    <button class="my-btn" onclick="sayHello()">Нажми меня</button>


    <script>
        function sayHello() {
            // 1. Создаем список крутых цветов
            const colors = ["#ff5722", "#4caf50", "#2196f3", "#9c27b0", "#ffeb3b", "#e91e63"];
            
            // 2. Компьютер случайно выбирает один цвет из списка
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            // 3. Перекрашиваем фон страницы в этот случайный цвет!
            document.body.style.backgroundColor = randomColor;
        }
    </script>

</body>
</html>
